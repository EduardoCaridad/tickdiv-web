<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unirse a un piso · TickDiv</title>
<style>
  :root { --verde:#0e7250; --tinta:#1f2937; --suave:#6b7280; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tinta); background:#f7f8fa; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .tarjeta {
    background:#fff; border-radius:16px; padding:40px 30px; max-width:460px; width:100%;
    text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08);
  }
  .logo {
    width:72px; height:72px; border-radius:18px; background:var(--verde);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px; color:#fff; font-size:28px; font-weight:700;
  }
  h1 { font-size:22px; margin:0 0 10px; color:var(--verde); }
  p { font-size:15px; line-height:1.6; margin:0 0 10px; }
  .codigo {
    display:inline-block; margin:12px 0; padding:10px 20px; background:#eefaf4; border:1px dashed var(--verde);
    border-radius:10px; font-size:22px; font-weight:700; letter-spacing:2px; color:var(--verde);
  }
  .suave { font-size:13px; color:var(--suave); margin-top:18px; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="logo">÷</div>
    <h1>Te han invitado a un piso</h1>
    <p>Para unirte, descarga <strong>TickDiv</strong> en tu móvil y usa este código de invitación dentro de la app:</p>
    <div class="codigo" id="codigo">—</div>
    <p class="suave">La app estará disponible muy pronto en Google Play.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var codigo = params.get("codigo");
    var caja = document.getElementById("codigo");
    if (codigo) { caja.textContent = codigo; }
    else { caja.style.display = "none"; }
  </script>
</body>
</html>
